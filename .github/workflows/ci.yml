name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test -- --watch=false
      - run: npm run contract
      - run: npm run build
      - name: Reject committed secrets
        run: "! git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|serviceAccountKey|FIREBASE_PRIVATE_KEY|IYZICO_SECRET_KEY|sk_live_[A-Za-z0-9]+|AKIA[0-9A-Z]{16})' -- ':!package-lock.json' ':!.github/workflows/ci.yml'"

  # Every push to main that passes `verify` is published to Cloudflare Pages.
  # Needs repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
  # Optional repository variables: CF_PAGES_PROJECT (default odivonf-gas), APP_CHECK_SITE_KEY.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'odivonf-gas' }}
      APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        run: npm run build
      - name: Write runtime config
        if: steps.creds.outputs.ready == 'true' && env.APP_CHECK_SITE_KEY != ''
        run: |
          printf "window.__ODIVON_CONFIG__ = window.__ODIVON_CONFIG__ || {\n  appCheckSiteKey: '%s',\n};\n" "$APP_CHECK_SITE_KEY" \
            > dist/OdivonF-Gas/browser/runtime-config.js
      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        run: >
          npx --yes wrangler@4 pages deploy dist/OdivonF-Gas/browser
          --project-name="$CF_PAGES_PROJECT" --branch=main
          --commit-hash="$GITHUB_SHA" --commit-dirty=true
