name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --watch=false
      - run: npm run contract
      - run: npm run build
      - name: Reject committed secrets
        run: "! git grep -nE '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|serviceAccountKey|FIREBASE_PRIVATE_KEY)' -- ':!package-lock.json' ':!.github/workflows/ci.yml'"
